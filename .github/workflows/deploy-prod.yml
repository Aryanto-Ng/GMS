name: Deploy Production

# Push/merge ke branch `main` (hanya setelah UAT lulus dan disetujui): tes -> build & push image ke GHCR (tag `latest`) -> deploy via SSH ke VPS Production.
# GitHub Secrets (Environment "production"): PROD_VPS_HOST, PROD_VPS_USER, PROD_VPS_SSH_KEY, PROD_VPS_PATH, PROD_VPS_PORT (opsional).
# Rahasia aplikasi (password DB, kunci S3, password admin) ada di file .env di server, bukan di repository.
# Beri Environment "production" required reviewers sebagai gerbang persetujuan terakhir.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/gms-api:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/gms-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/gms-web:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/gms-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PORT: ${{ secrets.PROD_VPS_PORT || 22 }}
      TARGET: ${{ secrets.PROD_VPS_USER }}@${{ secrets.PROD_VPS_HOST }}
      REMOTE_PATH: ${{ secrets.PROD_VPS_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Periksa GitHub Secrets deploy
        run: |
          missing=""
          for v in PROD_VPS_HOST PROD_VPS_USER PROD_VPS_PATH PROD_VPS_SSH_KEY; do
            if [ -z "$(printenv "$v")" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::GitHub Secrets belum diisi:$missing. Lihat docs/Secrets-Checklist.md (Settings > Secrets and variables > Actions)."
            exit 1
          fi
        env:
          PROD_VPS_HOST: ${{ secrets.PROD_VPS_HOST }}
          PROD_VPS_USER: ${{ secrets.PROD_VPS_USER }}
          PROD_VPS_PATH: ${{ secrets.PROD_VPS_PATH }}
          PROD_VPS_SSH_KEY: ${{ secrets.PROD_VPS_SSH_KEY }}
      - name: Siapkan SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.PROD_VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "${{ secrets.PROD_VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Salin compose Production dan skrip backup
        run: scp -i ~/.ssh/id_deploy -P "$SSH_PORT" -r deploy/prod deploy/backup "$TARGET:$REMOTE_PATH/"
      - name: Tarik image dan jalankan ulang
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$TARGET" \
            "cd '$REMOTE_PATH/prod' && export IMAGE_TAG=${{ needs.images.outputs.tag }} && docker compose -f docker-compose.prod.yml pull api web && docker compose -f docker-compose.prod.yml up -d --build --remove-orphans && docker image prune -f"
