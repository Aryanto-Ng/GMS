name: Deploy UAT (Render)

# Push ke branch `uat`: tes (ci.yml) -> memicu Deploy Hook Render untuk API lalu Web.
# Di Render, Auto-Deploy kedua layanan diset OFF; deploy hanya terjadi lewat workflow ini setelah tes lulus.
# GitHub Secrets (Environment "uat"): RENDER_DEPLOY_HOOK_API, RENDER_DEPLOY_HOOK_WEB (URL Deploy Hook dari Render: Settings > Deploy Hook).
# Rahasia aplikasi (connection string Supabase, password admin) diisi di dashboard Render, bukan di repository.
on:
  push:
    branches: [uat]
  workflow_dispatch:

concurrency:
  group: deploy-uat
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: uat
    env:
      HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
      HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
    steps:
      - name: Periksa GitHub Secrets deploy
        run: |
          missing=""
          [ -z "$HOOK_API" ] && missing="$missing RENDER_DEPLOY_HOOK_API"
          [ -z "$HOOK_WEB" ] && missing="$missing RENDER_DEPLOY_HOOK_WEB"
          if [ -n "$missing" ]; then
            echo "::error::GitHub Secrets belum diisi:$missing (Environment uat). URL Deploy Hook ada di Render > layanan > Settings."
            exit 1
          fi
      - name: Deploy API
        run: curl -fsS --retry 3 -X POST "$HOOK_API" && echo
      - name: Deploy Web
        run: curl -fsS --retry 3 -X POST "$HOOK_WEB" && echo
